<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace étudiant — AEDT</title><link rel="stylesheet" href="styles.css"><script src="assets/site.js?v=2" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header><div class="container nav"><a href="index.html" class="brand"><img src="assets/logo-aedt.jpeg" alt="Logo AEDT"><b>AEDT<small>Amicale des Étudiants de Thiès</small></b></a><nav aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="services.html">Services</a><a href="logement.html">Logement</a><a href="connexion.html">Connexion</a><a href="etudiant.html">Mon espace</a><a href="admin.html">Administration</a><button id="logout" class="btn light" hidden>Déconnexion</button></nav></div></header><main class="container"><section class="hero"><span class="eyebrow">ESPACE ÉTUDIANT</span><h1 id="welcome">Bienvenue</h1><p>Suivez votre dossier, vos notifications et vos échanges avec l’AEDT.</p></section><div id="msg"></div><section class="stats" id="stats"></section><div class="grid"><div class="panel"><h2>Mes demandes de logement</h2><div id="requests">Chargement…</div></div><div class="panel"><h2>Notifications</h2><div id="notifications">Chargement…</div></div></div><div class="panel"><h2>Contacter l’AEDT</h2><form id="contactForm"><label>Sujet<input id="subject" required placeholder="Ex. Question sur mon dossier"></label><label>Message<textarea id="body" rows="5" required></textarea></label><button class="btn blue">Envoyer le message</button></form><div id="contactMsg"></div></div></main><footer class="footer"><div class="container">© AEDT — Espace étudiant</div></footer><script>
const sb=window.AEDT?.getSupabaseClient?.(),$=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){if(!sb){$('#msg').innerHTML='<div class="error">Configuration Supabase introuvable. Vérifiez le fichier config.js.</div>';return}let u;try{u=(await sb.auth.getUser()).data?.user}catch(x){location.href='connexion.html';return}if(!u){location.href='connexion.html';return}const user=u;$('#logout').hidden=false;const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();$('#welcome').textContent='Bonjour '+(p?.first_name||p?.prenom||(user.email?user.email.split('@')[0]:'étudiant'))+' 👋';const {data:req,error:e}=await sb.from('housing_requests').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(e)$('#requests').innerHTML='<div class="error">'+esc(e.message)+'</div>';else{const r=req||[];$('#stats').innerHTML=`<div class="stat"><strong>${r.length}</strong><span>Demandes</span></div><div class="stat"><strong>${r.filter(x=>x.status==='Acceptée').length}</strong><span>Acceptées</span></div><div class="stat"><strong>${r.filter(x=>x.status==='En attente').length}</strong><span>En attente</span></div>`;$('#requests').innerHTML=r.map(x=>`<div class="card"><strong>${esc(x.dossier_code||x.id)}</strong><br>${esc(x.logement||'Demande de logement')}<br><span class="badge">${esc(x.status||'En attente')}</span><small>${x.created_at?new Date(x.created_at).toLocaleDateString('fr-FR'):''}</small></div>`).join('')||'<p>Aucune demande.</p>'}const {data:n,error:ne}=await sb.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20);if(ne)$('#notifications').innerHTML='<div class="error">'+esc(ne.message)+'</div>';else $('#notifications').innerHTML=(n||[]).map(x=>`<div class="card"><strong>${esc(x.title||'Notification')}</strong><p>${esc(x.message||'')}</p><small>${x.created_at?new Date(x.created_at).toLocaleString('fr-FR'):''}</small></div>`).join('')||'<p>Aucune notification.</p>'}
$('#contactForm').onsubmit=async e=>{if(!sb){$('#contactMsg').innerHTML='<div class="error">Configuration Supabase introuvable. Vérifiez le fichier config.js.</div>';return}e.preventDefault();const btn=e.target.querySelector('button[type="submit"],button');if(btn)btn.disabled=true;const {data:{user}}=await sb.auth.getUser();if(!user){location.href='connexion.html';return}const subject=$('#subject').value.trim(),body=$('#body').value.trim();if(!subject||!body){$('#contactMsg').innerHTML='<div class="error">Merci de renseigner un sujet et un message.</div>';if(btn)btn.disabled=false;return}const {error}=await sb.from('messages').insert({user_id:user.id,subject:subject,body:body});$('#contactMsg').innerHTML=error?'<div class="error">'+esc(error.message)+'</div>':'<div class="success">Message envoyé à l’AEDT.</div>';if(!error)e.target.reset();if(btn)btn.disabled=false};$('#logout').onclick=async()=>{if(!sb){location.href='index.html';return}await sb.auth.signOut();location.href='index.html'};init();</script></body></html>
