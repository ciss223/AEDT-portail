<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créer un compte — AEDT</title>
<style>
:root{--navy:#06254a;--blue:#0b55a1;--gold:#ffbd2e;--line:#e2eaf3;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef4fb,#f9fbff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172a43}
.box{width:min(500px,100%);background:white;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 55px #08264c12}.brand{color:var(--navy);font-weight:900;text-decoration:none}.tag{color:#b27a00;font-size:.8rem;font-weight:900;letter-spacing:.12em;margin-top:24px}.box h1{margin:8px 0;font-size:2rem}.intro{color:var(--muted);line-height:1.55}.auth-shortcuts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}.auth-shortcuts a{padding:7px 11px;border-radius:999px;background:#edf4fc;color:var(--navy);font-size:.82rem;font-weight:750;text-decoration:none}.auth-shortcuts a:hover{background:#dcecff}label{display:block;font-weight:750;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #ccd8e5;border-radius:10px;font:inherit}button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:20px;background:var(--blue);color:white;font:inherit;font-weight:850;cursor:pointer}.status{margin-top:14px;padding:12px;border-radius:10px;display:none;line-height:1.45}.status.error{display:block;background:#fff0f0;color:#a12828}.status.ok{display:block;background:#eaf8ef;color:#17683a}.foot{margin-top:20px;text-align:center;color:var(--muted);font-size:.92rem}.foot a,.back{color:var(--blue);font-weight:800}.back{display:inline-block;margin-top:20px;text-decoration:none}
</style>
</head>
<body><main class="box">
<a class="brand" href="index.html">AEDT · Portail étudiant</a>
<div class="tag">REJOINDRE L’ESPACE ÉTUDIANT</div><h1>Créer un compte</h1>
<p class="intro">Créez votre compte personnel pour accéder au suivi de vos démarches auprès de l’AEDT.</p>
<nav class="auth-shortcuts" aria-label="Explorer le portail"><a href="actualites.html">Actualités</a><a href="services.html">Services</a><a href="logement.html">Logement</a><a href="connexion.html">Connexion</a></nav>
<form id="register-form">
<label for="name">Nom complet</label><input id="name" required autocomplete="name" maxlength="100" placeholder="Votre nom et prénom">
<label for="email">Adresse e-mail</label><input id="email" type="email" required autocomplete="email" placeholder="vous@exemple.com">
<label for="password">Mot de passe</label><input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="8 caractères minimum">
<label for="confirm">Confirmer le mot de passe</label><input id="confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="Répétez le mot de passe">
<button type="submit">Créer mon compte</button>
</form><div id="status" class="status" role="status"></div>
<div class="foot">Vous avez déjà un compte ? <a href="connexion.html">Se connecter</a></div>
<a class="back" href="index.html">← Retour à l’accueil</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><link rel="stylesheet" href="assets/whatsapp.css"><script src="assets/whatsapp.js" defer></script>
<script>
(function(){
  var form=document.getElementById('register-form'), statusBox=document.getElementById('status');
  function show(text,kind){statusBox.textContent=text;statusBox.className='status '+kind}
  function getClient(){
    if(window.AEDT&&window.AEDT.getSupabaseClient){return window.AEDT.getSupabaseClient();}
    if(window.aedtSupabase)return window.aedtSupabase;
    if(window.supabaseClient)return window.supabaseClient;
    var url=window.AEDT_CONFIG&&window.AEDT_CONFIG.SUPABASE_URL;
    var key=window.AEDT_CONFIG&&window.AEDT_CONFIG.SUPABASE_ANON_KEY;
    if(url&&key&&window.supabase)return window.supabase.createClient(url,key);
    return null;
  }
  (async function redirectIfConnected(){
    var client=getClient();
    if(!client)return;
    try{
      var res=await client.auth.getUser();
      if(res&&res.data&&res.data.user)location.href='etudiant.html';
    }catch(err){/* session absente : on reste sur le formulaire */}
  })();

  form.addEventListener('submit',async function(e){
    e.preventDefault();
    var name=document.getElementById('name').value.trim();
    var email=document.getElementById('email').value.trim();
    var password=document.getElementById('password').value;
    var confirm=document.getElementById('confirm').value;
    if(!name){show('Merci d’indiquer votre nom complet.','error');return}
    if(password!==confirm){show('Les deux mots de passe ne correspondent pas.','error');return}
    if(password.length<8){show('Le mot de passe doit contenir au moins 8 caractères.','error');return}
    var client=getClient();
    if(!client){show('Configuration Supabase introuvable. Vérifiez config.js et le guide SETUP.md.','error');return}
    var btn=form.querySelector('button[type="submit"]');
    if(btn){btn.disabled=true;btn.textContent='Création en cours…'}
    try{
      var res=await client.auth.signUp({email:email,password:password,options:{data:{full_name:name}}});
      var error=res.error, data=res.data;
      if(error){show(error.message,'error');if(btn){btn.disabled=false;btn.textContent='Créer mon compte'}return}
      if(data&&data.session){
        show('Compte créé. Redirection vers votre espace…','ok');
        setTimeout(function(){location.href='etudiant.html'},800);
      }else{
        show('Compte créé. Vérifiez votre boîte e-mail pour confirmer votre inscription, puis connectez-vous.','ok');
        form.reset();
      }
    }catch(err){
      show('Une erreur est survenue : '+(err&&err.message?err.message:'inconnue'),'error');
    }finally{
      if(btn&&btn.textContent==='Création en cours…'){btn.disabled=false;btn.textContent='Créer mon compte'}
    }
  });
})();
</script></body></html>
